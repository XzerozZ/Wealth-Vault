name: Wealth & Vault CI Pipeline

# Trigger Strategy:
# - Execute on every push to the 'main' branch.
# - Execute when a new Git tag following the semantic versioning pattern (v1.2.3) is created.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Environment variables to resolve Node.js deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Define permissions for the GITHUB_TOKEN to allow pushing images to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up Docker Buildx for multi-platform builds and caching support.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry (ghcr.io) using the built-in GITHUB_TOKEN.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatically generate tags and labels for the Docker image.
      # Tags include: branch name (for main), full Git SHA, and semantic version (if tag).
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag with the branch name (e.g., 'main')
            type=ref,event=branch
            # Tag with the full 40-character Git commit SHA
            type=raw,value=${{ github.sha }}
            # Tag with semantic versioning (e.g., v1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build and Push the Docker image.
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          # MODIFY HERE: The build context. Set to '.' for the root directory.
          # For Go microservices in a monorepo, keeping the root as context is usually necessary 
          # if the Dockerfile references shared folders like /proto.
          context: .
          
          # MODIFY HERE: The path to the Dockerfile. 
          # Updated to a valid path found in the repository: ./api-gateway/dockerfile
          # If you copy this to another service, change this to: ./services/notification-service/dockerfile
          file: ./api-gateway/dockerfile
          
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
          # Implementation of GitHub Actions cache (type=gha) for faster subsequent builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

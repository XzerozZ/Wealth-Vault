name: Wealth&Vault CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - service_name: api-gateway
            dockerfile_path: ./api-gateway/dockerfile
          - service_name: user-service
            dockerfile_path: ./services/user-service/dockerfile
          - service_name: auth-service
            dockerfile_path: ./services/auth-service/dockerfile
          - service_name: asset-service
            dockerfile_path: ./services/asset-service/dockerfile
          - service_name: notification-service
            dockerfile_path: ./services/notification-service/dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: valhir/${{ matrix.service_name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ${{ matrix.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
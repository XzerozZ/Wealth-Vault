name: Auth Service CI Pipeline

# Trigger Logic:
# - Run on pushes to 'main' ONLY if files in 'services/auth-service/' or root Go files change.
# - Run when a new tag following the 'v*.*.*-auth' pattern is created.
on:
  push:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
      - 'go.mod'
      - 'go.sum'
    tags:
      - 'v*.*.*-auth'

# Environment variables to resolve Node.js deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Define permissions for the GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Auth Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up Docker Buildx for multi-platform builds and caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry (ghcr.io).
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatically generate tags and labels for the Docker image.
      # Targets: branch name, full Git SHA, and semantic version from tag.
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/auth-service
          tags: |
            # Tag with the branch name
            type=ref,event=branch
            # Tag with the full Git commit SHA
            type=raw,value=${{ github.sha }}
            # Extract semver from tag (e.g., v1.0.0-auth -> 1.0.0)
            type=match,pattern=v(.*)-auth,group=1
            type=semver,pattern={{version}}

      # Build and Push the Docker image.
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          # Context is root (.) because Dockerfile needs access to /proto folder.
          context: .
          
          # Path to the specific service Dockerfile (lowercase 'dockerfile').
          file: ./services/auth-service/dockerfile
          
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
          # GitHub Actions cache for faster builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

syntax = "proto3";

package asset;

option go_package = "wealth-vault/pkg/pb";

enum AssetType {
  ASSET_TYPE_UNSPECIFIED = 0;
  ASSET_TYPE_CASH = 1;         // เงินสด
  ASSET_TYPE_BANK = 2;         // ธนาคาร
  ASSET_TYPE_INVESTMENT = 3;   // หุ้น/กองทุน/Crypto
  ASSET_TYPE_REAL_ESTATE = 4;  // อสังหาฯ
  ASSET_TYPE_INSURANCE = 5;    // ประกัน
}

enum BankAccountType {
  BANK_ACC_TYPE_UNSPECIFIED = 0;
  BANK_ACC_TYPE_SAVINGS = 1;       // ออมทรัพย์
  BANK_ACC_TYPE_CURRENT = 2;       // กระแสรายวัน
  BANK_ACC_TYPE_FIXED_DEPOSIT = 3; // ฝากประจำ
}

enum InvestmentType {
  INVEST_TYPE_UNSPECIFIED = 0;
  INVEST_TYPE_STOCK_TH = 1;        // หุ้นไทย
  INVEST_TYPE_STOCK_US = 2;        // หุ้นนอก
  INVEST_TYPE_MUTUAL_FUND = 3;     // กองทุนรวม
  INVEST_TYPE_BOND = 4;            // พันธบัตร/หุ้นกู้
  INVEST_TYPE_CRYPTO = 5;          // Cryptocurrency
  INVEST_TYPE_GOLD = 6;            // ทองคำ (Digital/Paper)
}

enum RealEstateType {
  REAL_ESTATE_TYPE_UNSPECIFIED = 0;
  REAL_ESTATE_TYPE_CONDO = 1;      // คอนโด
  REAL_ESTATE_TYPE_HOUSE = 2;      // บ้านเดี่ยว
  REAL_ESTATE_TYPE_TOWNHOME = 3;   // ทาวน์โฮม
  REAL_ESTATE_TYPE_LAND = 4;       // ที่ดินเปล่า
  REAL_ESTATE_TYPE_COMMERCIAL = 5; // อาคารพาณิชย์
}

enum InsuranceType {
  INSURANCE_TYPE_UNSPECIFIED = 0;
  INSURANCE_TYPE_LIFE = 1;         // ชีวิต/สะสมทรัพย์
  INSURANCE_TYPE_HEALTH = 2;       // สุขภาพ
  INSURANCE_TYPE_ACCIDENT = 3;     // อุบัติเหตุ (PA)
  INSURANCE_TYPE_PROPERTY = 4;     // อัคคีภัย/บ้าน
  INSURANCE_TYPE_VEHICLE = 5;      // รถยนต์
}

enum LiabilityType {
  LIABILITY_TYPE_UNSPECIFIED = 0;
  LIABILITY_TYPE_LOAN = 1;          // หนี้
  LIABILITY_TYPE_EXPENSE = 2;       // ค่าใช้จ่ายต่อเนื่อง
}
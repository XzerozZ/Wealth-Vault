syntax = "proto3";

package asset;

option go_package = "wealth-vault/pkg/pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "proto/asset/location.proto";
import "proto/asset/file.proto";

message Land {
  string id = 1; 
  string user_id = 2;
  string name = 3;
  string deed_num = 4;
  double area = 5;
  double amount = 6; 
  string description = 7;
  Location location = 8;
  repeated FileInfo files = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  repeated Reference ref = 12;
  google.protobuf.Timestamp deleted_at = 20;
}

message CreateLandRequest { 
  string user_id = 1;
  string name = 2;
  string deed_num = 3;
  double area = 4;
  double amount = 5; 
  string description = 6;
  Location location = 7;
  repeated FileInfo new_files = 8;
  repeated string building_ids = 9;
}

message UpdateLandRequest{
  string id = 1; 
  Land land = 2;
  repeated FileInfo new_files = 3;
  repeated string delete_file_ids = 4;
  google.protobuf.FieldMask update_mask = 5;
  repeated string building_ids = 6;
  repeated string delete_building_ids = 7;
}

message LandArrayResponse { 
  bool success = 1;
  repeated Land land = 2; 
}

message  LandResponse { 
  bool success = 1;
  Land land = 2; 
}
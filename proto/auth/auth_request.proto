syntax = "proto3";

package auth;

option go_package = "wealth-vault/pkg/pb";

import "proto/auth/auth.proto";
import "proto/auth/password.proto";

service AuthService {
  rpc Register(AuthRequest) returns (AuthResponse);
  rpc Login(AuthRequest) returns (AuthResponse);
  rpc LoginGoogle(GoogleRequest) returns (AuthResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc VerifyForgotPasswordOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);

  rpc GetProviderAccount(GetProviderAccountRequest) returns (GetProviderAccountsResponse);

  rpc LinkLineAccount(LinkLineAccountRequest) returns (LinkAccountResponse);
}
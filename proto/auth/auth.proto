syntax = "proto3";

package auth;

option go_package = "wealth-vault/pkg/pb";

message AuthRequest {
  string email = 1;
  string password = 2;
}

message GoogleRequest {
  string token = 1;
}

message AuthResponse {
  bool success = 1;
  string access_token = 2;
  string refresh_token = 3;
  string user_id = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message GetProviderAccountRequest {
  string user_id = 1;
}

message LinkLineAccountRequest {
  string user_id = 1;
  string line_user_id = 2;
}

message LinkAccountResponse {
  bool success = 1;
}

message ProviderAccount {
  string provider = 1;
  bool is_linked = 2; 
  string provider_account_id = 3;
}

message GetProviderAccountsResponse {
  repeated ProviderAccount accounts = 1; 
}
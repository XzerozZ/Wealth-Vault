syntax = "proto3";

package auth;

option go_package = "wealth-vault/pkg/pb";

message AuthRequest {
  string email = 1;
  string password = 2;
}

message GoogleRequest {
  string token = 1;
}

message AuthResponse {
  bool success = 1;
  string access_token = 2;
  string refresh_token = 3;
  string user_id = 4;
  int32 access_token_expires_in = 5;
}

message LineExchangeRequest {
  string id_token = 1;
  string channel_id = 2;
}

message LineChallengeRequest {
  string challenge_id = 1;
  string channel_id = 2;
  string action = 3;
  string email = 4;
  string password = 5;
  string username = 6;
  string first_name = 7;
  string last_name = 8;
}

message LineAuthResponse {
  string status = 1;
  string challenge_id = 2;
  string user_id = 3;
  string display_name = 4;
  string access_token = 5;
  string refresh_token = 6;
  int32 access_token_expires_in = 7;
}

message RevokeSessionRequest {
  string refresh_token = 1;
}

message RevokeSessionResponse {
  bool success = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message GetProviderAccountRequest {
  string user_id = 1;
}

message LinkLineAccountRequest {
  string user_id = 1;
  string line_user_id = 2;
}

message LinkAccountResponse {
  bool success = 1;
}

message ProviderAccount {
  string provider = 1;
  bool is_linked = 2; 
  string provider_account_id = 3;
}

message GetProviderAccountsResponse {
  repeated ProviderAccount accounts = 1; 
}
